<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パンケーキ整理券</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px 20px;
    }

    h1 { font-size: 32px; }
    .label { font-size: 18px; margin-top: 30px; }

    #currentNumber {
      font-size: 40px;
      font-weight: bold;
      margin: 10px;
    }

    #ticketNumber {
      font-size: 60px;
      font-weight: bold;
      margin: 20px;
    }

    #waitingText { font-size: 26px; margin: 20px; }
    #waitingTime { font-size: 22px; margin: 20px; }

    button {
      font-size: 22px;
      padding: 15px 35px;
      margin: 10px;
      cursor: pointer;
    }

    button:disabled { opacity: .5; }
  </style>
</head>

<body>

  <h1>🥞 パンケーキ整理券</h1>

  <div class="label">現在呼び出し中</div>
  <div id="currentNumber">A000</div>

  <div class="label">あなたの番号</div>
  <div id="ticketNumber">---</div>

  <div id="waitingText"></div>
  <div id="waitingTime"></div>

  <button id="ticketButton">整理券を発行</button>
  <br>
  <button id="soundButton">🔔 通知音を有効にする</button>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getDatabase, ref, onValue, runTransaction, get
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


    const firebaseConfig = {
      apiKey: "AIzaSyCGLGkUuNKPWxT9w0mmsLeCulITfBgYRCE",
      authDomain: "pancake-ce940.firebaseapp.com",
      databaseURL: "https://pancake-ce940-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "pancake-ce940",
      storageBucket: "pancake-ce940.firebasestorage.app",
      messagingSenderId: "953995426233",
      appId: "1:953995426233:web:66d61ae6990de43c9b5e68"
    };


    const db = getDatabase(initializeApp(firebaseConfig));

    const currentRef = ref(db, "currentNumber");
    const counterRef = ref(db, "ticketCounter");
    const sessionRef = ref(db, "sessionId");

    const currentDisplay = document.getElementById("currentNumber");
    const ticketDisplay = document.getElementById("ticketNumber");
    const waitingText = document.getElementById("waitingText");
    const waitingTime = document.getElementById("waitingTime");
    const ticketButton = document.getElementById("ticketButton");
    const soundButton = document.getElementById("soundButton");

    let current = 0;
    let myNumber = null;
    let sessionId = 0;
    let audioCtx = null;
    let soundPlayed = false;

    const format = n =>
      "A" + String(n).padStart(3, "0");


    // 音を鳴らす
    function beep() {
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.frequency.value = 880;
      gain.gain.value = .3;

      osc.start();
      osc.stop(audioCtx.currentTime + .8);
    }


    // 通知音を有効化
    soundButton.addEventListener("click", async () => {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        await audioCtx.resume();

        // テスト音
        beep();

        soundButton.textContent = "🔔 通知音 ON";
        soundButton.disabled = true;

      } catch (error) {
        console.error(error);
        alert("通知音を有効にできませんでした");
      }
    });


    function updateWaiting() {
      if (myNumber === null) {
        waitingText.textContent = "";
        waitingTime.textContent = "";
        return;
      }

      const difference = myNumber - current;

      if (difference > 0) {
        const ahead = Math.max(difference - 1, 0);

        waitingText.textContent =
          ahead ? `前に${ahead}組お待ちです` : "次にお呼びします";

        waitingTime.textContent =
          `待ち時間の目安：約${difference * 3}分`;

      } else if (difference === 0) {
        waitingText.textContent = "あなたの順番です！";
        waitingTime.textContent = "店頭までお越しください";

        if (!soundPlayed && audioCtx) {
          beep();
          soundPlayed = true;
        }

      } else {
        waitingText.textContent = "呼び出し済みです";
        waitingTime.textContent = "";
      }
    }


    // 最初の読み込み
    async function initialize() {
      sessionId = (await get(sessionRef)).val() || 0;

      const saved = localStorage.getItem("pancakeTicket");

      if (saved) {
        try {
          const data = JSON.parse(saved);

          if (data.sessionId === sessionId) {
            myNumber = data.number;
            ticketDisplay.textContent = format(myNumber);
            ticketButton.textContent = "整理券は発行済みです";
            ticketButton.disabled = true;
          } else {
            localStorage.removeItem("pancakeTicket");
          }
        } catch {
          localStorage.removeItem("pancakeTicket");
        }
      }

      updateWaiting();


      // 店員が全員リセットしたことを検知
      onValue(sessionRef, snapshot => {
        const newSession = snapshot.val() || 0;

        if (newSession === sessionId) return;

        sessionId = newSession;
        myNumber = null;
        soundPlayed = false;

        localStorage.removeItem("pancakeTicket");

        ticketDisplay.textContent = "---";
        waitingText.textContent = "";
        waitingTime.textContent = "";
        ticketButton.textContent = "整理券を発行";
        ticketButton.disabled = false;
      });
    }


    // 店員側の呼び出しをリアルタイム監視
    onValue(currentRef, snapshot => {
      current = snapshot.val() || 0;
      currentDisplay.textContent = format(current);
      updateWaiting();
    });


    // 整理券発行
    ticketButton.addEventListener("click", async () => {
      ticketButton.disabled = true;

      try {
        const result = await runTransaction(
          counterRef,
          n => (n || 0) + 1
        );

        myNumber = result.snapshot.val();
        soundPlayed = false;

        ticketDisplay.textContent = format(myNumber);
        ticketButton.textContent = "整理券は発行済みです";

        localStorage.setItem(
          "pancakeTicket",
          JSON.stringify({
            number: myNumber,
            sessionId
          })
        );

        updateWaiting();

      } catch (error) {
        console.error(error);
        alert("整理券の発行に失敗しました");
        ticketButton.disabled = false;
      }
    });


    initialize();

  </script>
</body>
</html>
