<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>パンケーキ整理券</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 32px;
    }

    .label {
      font-size: 18px;
      margin-top: 30px;
    }

    #currentNumber {
      font-size: 40px;
      font-weight: bold;
      margin: 10px;
    }

    #ticketNumber {
      font-size: 60px;
      font-weight: bold;
      margin: 20px;
    }

    #waitingText {
      font-size: 26px;
      margin: 20px;
    }

    #waitingTime {
      font-size: 22px;
      margin: 20px;
    }

    button {
      font-size: 22px;
      padding: 15px 35px;
      cursor: pointer;
      margin-top: 15px;
    }

    button:disabled {
      cursor: default;
    }
  </style>
</head>


<body>

  <h1>🥞 パンケーキ整理券</h1>


  <div class="label">
    現在呼び出し中
  </div>

  <div id="currentNumber">
    A000
  </div>


  <div class="label">
    あなたの番号
  </div>

  <div id="ticketNumber">
    ---
  </div>


  <div id="waitingText"></div>

  <div id="waitingTime"></div>


  <button id="ticketButton">
    整理券を発行
  </button>


  <script type="module">

    // ==========================================
    // Firebase
    // ==========================================

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue,
      runTransaction
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyCGLGkUuNKPWxT9w0mmsLeCulITfBgYRCE",

      authDomain:
        "pancake-ce940.firebaseapp.com",

      databaseURL:
        "https://pancake-ce940-default-rtdb.asia-southeast1.firebasedatabase.app",

      projectId:
        "pancake-ce940",

      storageBucket:
        "pancake-ce940.firebasestorage.app",

      messagingSenderId:
        "953995426233",

      appId:
        "1:953995426233:web:66d61ae6990de43c9b5e68"
    };


    const app =
      initializeApp(firebaseConfig);

    const database =
      getDatabase(app);


    // ==========================================
    // HTMLの要素
    // ==========================================

    const button =
      document.getElementById("ticketButton");

    const ticketDisplay =
      document.getElementById("ticketNumber");

    const currentDisplay =
      document.getElementById("currentNumber");

    const waitingText =
      document.getElementById("waitingText");

    const waitingTime =
      document.getElementById("waitingTime");


    // ==========================================
    // 変数
    // ==========================================

    let currentCallNumber = 0;

    let myTicketNumber = null;


    // 1組あたりの待ち時間の目安（3分）
    const minutesPerGroup = 3;


    // ==========================================
    // QRコードから来た場合だけリセット
    //
    // QRコードのURL：
    // https://a26i269.github.io/pancake/?reset=1
    // ==========================================

    const params =
      new URLSearchParams(window.location.search);


    if (params.get("reset") === "1") {

      // このスマホに保存されている
      // 前回の整理券を削除
      localStorage.removeItem(
        "pancakeTicket"
      );


      // URLから ?reset=1 を消す
      //
      // これによって、
      // QRから入った後にページを更新しても
      // もう一度リセットされることを防ぐ
      window.history.replaceState(
        {},
        "",
        window.location.pathname
      );

    }


    // ==========================================
    // 保存済みの整理券を確認
    // ==========================================

    const savedTicket =
      localStorage.getItem(
        "pancakeTicket"
      );


    if (savedTicket) {

      // 保存されている番号を表示
      ticketDisplay.textContent =
        savedTicket;


      // A005 → 5 のように数字だけ取り出す
      myTicketNumber =
        Number(
          savedTicket.replace("A", "")
        );


      button.textContent =
        "整理券は発行済みです";


      button.disabled = true;

    }


    // ==========================================
    // 現在呼び出し中の番号
    // ==========================================

    const currentRef =
      ref(
        database,
        "currentNumber"
      );


    // Firebaseの番号が変わったら
    // お客さんのスマホも自動更新
    onValue(
      currentRef,
      (snapshot) => {

        currentCallNumber =
          snapshot.val() || 0;


        currentDisplay.textContent =
          "A" +
          String(
            currentCallNumber
          ).padStart(3, "0");


        updateWaitingInfo();

      }
    );


    // ==========================================
    // 待ち組数・待ち時間
    // ==========================================

    function updateWaitingInfo() {

      // まだ整理券を持っていない場合
      if (myTicketNumber === null) {

        waitingText.textContent = "";

        waitingTime.textContent = "";

        return;
      }


      const difference =
        myTicketNumber -
        currentCallNumber;


      // ------------------------------------------
      // まだ自分の順番ではない
      // ------------------------------------------

      if (difference > 0) {

        waitingText.textContent =
          "あと" +
          difference +
          "組です";


        const estimatedMinutes =
          difference *
          minutesPerGroup;


        waitingTime.textContent =
          "待ち時間の目安：約" +
          estimatedMinutes +
          "分";

      }


      // ------------------------------------------
      // 自分の順番
      // ------------------------------------------

      else if (difference === 0) {

        waitingText.textContent =
          "あなたの順番です！";


        waitingTime.textContent =
          "店頭までお越しください";

      }


      // ------------------------------------------
      // すでに呼び出し済み
      // ------------------------------------------

      else {

        waitingText.textContent =
          "呼び出し済みです";


        waitingTime.textContent = "";

      }

    }


    // ==========================================
    // 整理券を発行
    // ==========================================

    button.addEventListener(
      "click",
      async () => {

        // 二重クリック防止
        button.disabled = true;


        const counterRef =
          ref(
            database,
            "ticketCounter"
          );


        try {

          // Firebaseの番号を1増やす
          //
          // 同時に複数人が押しても
          // 同じ番号にならないよう
          // Transactionを使用
          const result =
            await runTransaction(
              counterRef,
              (currentNumber) => {

                if (
                  currentNumber === null
                ) {

                  return 1;

                }


                return (
                  currentNumber + 1
                );

              }
            );


          const number =
            result.snapshot.val();


          // 例：
          // 1 → A001
          // 12 → A012
          const ticket =
            "A" +
            String(
              number
            ).padStart(3, "0");


          // 整理券番号を画面に表示
          ticketDisplay.textContent =
            ticket;


          // ======================================
          // このスマホに整理券を保存
          // ======================================

          localStorage.setItem(
            "pancakeTicket",
            ticket
          );


          myTicketNumber =
            number;


          button.textContent =
            "整理券は発行済みです";


          updateWaitingInfo();


        } catch (error) {

          console.error(error);


          alert(
            "整理券の発行に失敗しました"
          );


          button.disabled = false;

        }

      }
    );

  </script>

</body>

</html>
