<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>パンケーキ整理券</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 32px;
    }

    .label {
      font-size: 18px;
      margin-top: 30px;
    }

    #currentNumber {
      font-size: 40px;
      font-weight: bold;
      margin: 10px;
    }

    #ticketNumber {
      font-size: 60px;
      font-weight: bold;
      margin: 20px;
    }

    #waitingText {
      font-size: 26px;
      margin: 20px;
    }

    #waitingTime {
      font-size: 22px;
      margin: 20px;
    }

    button {
      font-size: 22px;
      padding: 15px 35px;
      cursor: pointer;
      margin-top: 15px;
    }

    button:disabled {
      cursor: default;
    }
  </style>
</head>

<body>

  <h1>🥞 パンケーキ整理券</h1>

  <div class="label">
    現在呼び出し中
  </div>

  <div id="currentNumber">
    A000
  </div>

  <div class="label">
    あなたの番号
  </div>

  <div id="ticketNumber">
    ---
  </div>

  <div id="waitingText"></div>

  <div id="waitingTime"></div>

  <button id="ticketButton">
    整理券を発行
  </button>

  <script type="module">

    // ==========================================
    // Firebase
    // ==========================================

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue,
      runTransaction,
      get
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


    const firebaseConfig = {
      apiKey:
        "AIzaSyCGLGkUuNKPWxT9w0mmsLeCulITfBgYRCE",

      authDomain:
        "pancake-ce940.firebaseapp.com",

      databaseURL:
        "https://pancake-ce940-default-rtdb.asia-southeast1.firebasedatabase.app",

      projectId:
        "pancake-ce940",

      storageBucket:
        "pancake-ce940.firebasestorage.app",

      messagingSenderId:
        "953995426233",

      appId:
        "1:953995426233:web:66d61ae6990de43c9b5e68"
    };


    const app =
      initializeApp(firebaseConfig);

    const database =
      getDatabase(app);


    // ==========================================
    // HTML要素
    // ==========================================

    const button =
      document.getElementById("ticketButton");

    const ticketDisplay =
      document.getElementById("ticketNumber");

    const currentDisplay =
      document.getElementById("currentNumber");

    const waitingText =
      document.getElementById("waitingText");

    const waitingTime =
      document.getElementById("waitingTime");


    // ==========================================
    // Firebase参照
    // ==========================================

    const currentRef =
      ref(database, "currentNumber");

    const counterRef =
      ref(database, "ticketCounter");

    const sessionRef =
      ref(database, "sessionId");


    // ==========================================
    // 状態
    // ==========================================

    let currentCallNumber = 0;

    let myTicketNumber = null;

    let currentSessionId = 0;

    const minutesPerGroup = 3;


    // ==========================================
    // 初期化
    // ==========================================

    async function initialize() {

      // Firebaseの現在のsessionIdを取得
      const sessionSnapshot =
        await get(sessionRef);

      currentSessionId =
        sessionSnapshot.val() || 0;


      // ------------------------------------------
      // スマホに保存された整理券を確認
      // ------------------------------------------

      const savedData =
        localStorage.getItem(
          "pancakeTicket"
        );


      if (savedData) {

        try {

          const data =
            JSON.parse(savedData);


          // 今のセッションと同じなら整理券は有効
          if (
            data.sessionId ===
            currentSessionId
          ) {

            myTicketNumber =
              data.number;


            ticketDisplay.textContent =
              "A" +
              String(
                myTicketNumber
              ).padStart(3, "0");


            button.textContent =
              "整理券は発行済みです";


            button.disabled = true;

          }

          // セッションが違えば古い整理券
          else {

            localStorage.removeItem(
              "pancakeTicket"
            );

          }

        } catch (error) {

          // 保存データが壊れていた場合
          localStorage.removeItem(
            "pancakeTicket"
          );

        }

      }

      updateWaitingInfo();

    }


    initialize();


    // ==========================================
    // 現在呼び出し番号をリアルタイム監視
    // ==========================================

    onValue(
      currentRef,
      (snapshot) => {

        currentCallNumber =
          snapshot.val() || 0;


        currentDisplay.textContent =
          "A" +
          String(
            currentCallNumber
          ).padStart(3, "0");


        updateWaitingInfo();

      }
    );


    // ==========================================
    // sessionIdをリアルタイム監視
    // ==========================================

    onValue(
      sessionRef,
      (snapshot) => {

        const newSessionId =
          snapshot.val() || 0;


        // 店員がリセットした場合
        if (
          newSessionId !==
          currentSessionId
        ) {

          currentSessionId =
            newSessionId;


          // 古い整理券を削除
          localStorage.removeItem(
            "pancakeTicket"
          );


          myTicketNumber = null;


          ticketDisplay.textContent =
            "---";


          waitingText.textContent =
            "";


          waitingTime.textContent =
            "";


          button.textContent =
            "整理券を発行";


          button.disabled = false;

        }

      }
    );


    // ==========================================
    // 待ち時間表示
    // ==========================================

    function updateWaitingInfo() {

      // 整理券を持っていない
      if (myTicketNumber === null) {

        waitingText.textContent = "";

        waitingTime.textContent = "";

        return;

      }


      const difference =
        myTicketNumber -
        currentCallNumber;


      // ------------------------------------------
      // まだ順番が来ていない
      // ------------------------------------------

      if (difference > 0) {

        const groupsAhead =
          Math.max(
            difference - 1,
            0
          );


        if (groupsAhead === 0) {

          waitingText.textContent =
            "次にお呼びします";

        } else {

          waitingText.textContent =
            "前に" +
            groupsAhead +
            "組お待ちです";

        }


        const estimatedMinutes =
          difference *
          minutesPerGroup;


        waitingTime.textContent =
          "待ち時間の目安：約" +
          estimatedMinutes +
          "分";

      }


      // ------------------------------------------
      // 自分の順番
      // ------------------------------------------

      else if (difference === 0) {

        waitingText.textContent =
          "あなたの順番です！";


        waitingTime.textContent =
          "店頭までお越しください";

      }


      // ------------------------------------------
      // 呼び出し済み
      // ------------------------------------------

      else {

        waitingText.textContent =
          "呼び出し済みです";


        waitingTime.textContent = "";

      }

    }


    // ==========================================
    // 整理券発行
    // ==========================================

    button.addEventListener(
      "click",
      async () => {

        button.disabled = true;


        try {

          // ticketCounterを安全に+1
          const result =
            await runTransaction(
              counterRef,
              (currentNumber) => {

                if (
                  currentNumber === null
                ) {

                  return 1;

                }


                return currentNumber + 1;

              }
            );


          const number =
            result.snapshot.val();


          myTicketNumber =
            number;


          const ticket =
            "A" +
            String(
              number
            ).padStart(3, "0");


          ticketDisplay.textContent =
            ticket;


          // --------------------------------------
          // スマホに保存
          // --------------------------------------

          const saveData = {
            number: number,
            sessionId: currentSessionId
          };


          localStorage.setItem(
            "pancakeTicket",
            JSON.stringify(saveData)
          );


          button.textContent =
            "整理券は発行済みです";


          button.disabled = true;


          updateWaitingInfo();


        } catch (error) {

          console.error(error);


          alert(
            "整理券の発行に失敗しました"
          );


          button.disabled = false;

        }

      }
    );

  </script>

</body>

</html>
