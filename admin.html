<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パンケーキ整理券 管理画面</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 50px 20px;
    }

    h1 { font-size: 32px; }

    .label {
      font-size: 18px;
      margin-top: 25px;
    }

    #currentNumber {
      font-size: 60px;
      font-weight: bold;
      margin: 20px;
    }

    #issuedNumber {
      font-size: 30px;
      font-weight: bold;
      margin: 10px;
    }

    #statusText {
      font-size: 20px;
      margin: 20px;
    }

    button {
      font-size: 22px;
      padding: 15px 35px;
      margin: 10px;
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      opacity: 0.5;
    }

    #resetButton { background: #eee; }
  </style>
</head>

<body>

  <h1>🥞 店員用 管理画面</h1>

  <div class="label">現在呼び出し中</div>
  <div id="currentNumber">A000</div>

  <div class="label">現在の最終発行番号</div>
  <div id="issuedNumber">A000</div>

  <div id="statusText"></div>

  <button id="nextButton">次の番号を呼ぶ</button>
  <br>
  <button id="resetButton">全員リセット</button>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue,
      runTransaction,
      get,
      update
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCGLGkUuNKPWxT9w0mmsLeCulITfBgYRCE",
      authDomain: "pancake-ce940.firebaseapp.com",
      databaseURL: "https://pancake-ce940-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "pancake-ce940",
      storageBucket: "pancake-ce940.firebasestorage.app",
      messagingSenderId: "953995426233",
      appId: "1:953995426233:web:66d61ae6990de43c9b5e68"
    };

    const db = getDatabase(initializeApp(firebaseConfig));

    const currentRef = ref(db, "currentNumber");
    const counterRef = ref(db, "ticketCounter");
    const sessionRef = ref(db, "sessionId");

    const currentDisplay = document.getElementById("currentNumber");
    const issuedDisplay = document.getElementById("issuedNumber");
    const statusText = document.getElementById("statusText");
    const nextButton = document.getElementById("nextButton");
    const resetButton = document.getElementById("resetButton");

    let current = 0;
    let counter = 0;

    const format = n =>
      "A" + String(n).padStart(3, "0");

    function updateStatus() {
      if (counter === 0) {
        statusText.textContent = "現在、待っているお客様はいません";
        nextButton.disabled = true;
      } else if (current >= counter) {
        statusText.textContent = "発行済みの整理券はすべて呼び出しました";
        nextButton.disabled = true;
      } else {
        statusText.textContent = `呼び出し待ち：${counter - current}組`;
        nextButton.disabled = false;
      }
    }

    onValue(currentRef, snapshot => {
      current = snapshot.val() || 0;
      currentDisplay.textContent = format(current);
      updateStatus();
    });

    onValue(counterRef, snapshot => {
      counter = snapshot.val() || 0;
      issuedDisplay.textContent = format(counter);
      updateStatus();
    });

    nextButton.addEventListener("click", async () => {
      nextButton.disabled = true;

      try {
        const latest = (await get(counterRef)).val() || 0;

        await runTransaction(
          currentRef,
          n => (n || 0) >= latest ? (n || 0) : (n || 0) + 1
        );
      } catch (error) {
        console.error(error);
        alert("番号の更新に失敗しました");
      }

      updateStatus();
    });

    resetButton.addEventListener("click", async () => {
      if (!confirm("本当に全員の整理券をリセットしますか？")) return;

      resetButton.disabled = true;
      nextButton.disabled = true;

      try {
        const session = (await get(sessionRef)).val() || 0;

        await update(ref(db), {
          ticketCounter: 0,
          currentNumber: 0,
          sessionId: session + 1
        });

        alert("整理券をリセットしました");
      } catch (error) {
        console.error(error);
        alert("リセットに失敗しました");
      }

      resetButton.disabled = false;
      updateStatus();
    });
  </script>

</body>
</html>
