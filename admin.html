<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>パンケーキ整理券 管理画面</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 50px 20px;
    }

    h1 {
      font-size: 32px;
    }

    .label {
      font-size: 18px;
      margin-top: 25px;
    }

    #currentNumber {
      font-size: 60px;
      font-weight: bold;
      margin: 20px;
    }

    #issuedNumber {
      font-size: 30px;
      font-weight: bold;
      margin: 10px;
    }

    #statusText {
      font-size: 20px;
      margin: 20px;
    }

    button {
      font-size: 22px;
      padding: 15px 35px;
      margin: 10px;
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      opacity: 0.5;
    }

    #resetButton {
      background-color: #eeeeee;
    }
  </style>
</head>


<body>

  <h1>🥞 店員用 管理画面</h1>


  <div class="label">
    現在呼び出し中
  </div>

  <div id="currentNumber">
    A000
  </div>


  <div class="label">
    現在の最終発行番号
  </div>

  <div id="issuedNumber">
    A000
  </div>


  <div id="statusText">
  </div>


  <button id="nextButton">
    次の番号を呼ぶ
  </button>

  <br>

  <button id="resetButton">
    全員リセット
  </button>


  <script type="module">

    // ==========================================
    // Firebase
    // ==========================================

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue,
      runTransaction,
      get,
      update
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyCGLGkUuNKPWxT9w0mmsLeCulITfBgYRCE",

      authDomain:
        "pancake-ce940.firebaseapp.com",

      databaseURL:
        "https://pancake-ce940-default-rtdb.asia-southeast1.firebasedatabase.app",

      projectId:
        "pancake-ce940",

      storageBucket:
        "pancake-ce940.firebasestorage.app",

      messagingSenderId:
        "953995426233",

      appId:
        "1:953995426233:web:66d61ae6990de43c9b5e68"
    };


    const app =
      initializeApp(firebaseConfig);

    const database =
      getDatabase(app);


    // ==========================================
    // HTML要素
    // ==========================================

    const currentDisplay =
      document.getElementById("currentNumber");

    const issuedDisplay =
      document.getElementById("issuedNumber");

    const statusText =
      document.getElementById("statusText");

    const nextButton =
      document.getElementById("nextButton");

    const resetButton =
      document.getElementById("resetButton");


    // ==========================================
    // Firebase参照
    // ==========================================

    const currentRef =
      ref(database, "currentNumber");

    const counterRef =
      ref(database, "ticketCounter");

    const sessionRef =
      ref(database, "sessionId");

    const rootRef =
      ref(database);


    // ==========================================
    // 現在の状態
    // ==========================================

    let currentNumber = 0;

    let ticketCounter = 0;


    // ==========================================
    // A001形式に変換する関数
    // ==========================================

    function formatTicket(number) {

      return (
        "A" +
        String(number).padStart(3, "0")
      );

    }


    // ==========================================
    // ボタン・状態表示を更新
    // ==========================================

    function updateStatus() {

      // 発行された整理券がない
      if (ticketCounter === 0) {

        statusText.textContent =
          "現在、待っているお客様はいません";

        nextButton.disabled = true;

        return;

      }


      // 全員呼び出し済み
      if (currentNumber >= ticketCounter) {

        statusText.textContent =
          "発行済みの整理券はすべて呼び出しました";

        nextButton.disabled = true;

        return;

      }


      // 呼び出せる人がいる
      const waiting =
        ticketCounter - currentNumber;


      statusText.textContent =
        "呼び出し待ち：" +
        waiting +
        "組";


      nextButton.disabled = false;

    }


    // ==========================================
    // 現在呼び出し番号を監視
    // ==========================================

    onValue(
      currentRef,
      (snapshot) => {

        currentNumber =
          snapshot.val() || 0;


        currentDisplay.textContent =
          formatTicket(currentNumber);


        updateStatus();

      }
    );


    // ==========================================
    // 発行済み番号を監視
    // ==========================================

    onValue(
      counterRef,
      (snapshot) => {

        ticketCounter =
          snapshot.val() || 0;


        issuedDisplay.textContent =
          formatTicket(ticketCounter);


        updateStatus();

      }
    );


    // ==========================================
    // 次の番号を呼ぶ
    // ==========================================

    nextButton.addEventListener(
      "click",
      async () => {

        nextButton.disabled = true;


        try {

          // 最新の発行番号をFirebaseから取得
          const counterSnapshot =
            await get(counterRef);


          const latestCounter =
            counterSnapshot.val() || 0;


          // currentNumberを安全に更新
          await runTransaction(
            currentRef,
            (current) => {

              const number =
                current || 0;


              // 発行済み番号まで到達していたら
              // それ以上増やさない
              if (
                number >=
                latestCounter
              ) {

                return number;

              }


              return number + 1;

            }
          );


        } catch (error) {

          console.error(error);


          alert(
            "番号の更新に失敗しました"
          );

        }


        updateStatus();

      }
    );


    // ==========================================
    // 全員リセット
    // ==========================================

    resetButton.addEventListener(
      "click",
      async () => {

        const ok =
          confirm(
            "本当に全員の整理券をリセットしますか？"
          );


        if (!ok) {
          return;
        }


        resetButton.disabled = true;

        nextButton.disabled = true;


        try {

          // 現在のsessionIdを取得
          const sessionSnapshot =
            await get(sessionRef);


          const currentSession =
            sessionSnapshot.val() || 0;


          // --------------------------------------
          // まとめて更新
          // --------------------------------------

          await update(
            rootRef,
            {

              // 次の整理券をA001からにする
              ticketCounter: 0,

              // 呼び出し番号をA000へ
              currentNumber: 0,

              // 前の整理券を無効にする
              sessionId:
                currentSession + 1

            }
          );


          alert(
            "整理券をリセットしました"
          );


        } catch (error) {

          console.error(error);


          alert(
            "リセットに失敗しました"
          );

        }


        resetButton.disabled = false;

        updateStatus();

      }
    );

  </script>

</body>

</html>
